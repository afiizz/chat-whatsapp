<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN UNIFICADA -->
  <div id="login-container">
    <div class="login-card">
      <div class="whatsapp-logo">💬</div>
      <h2>Acceso al Chat Privado</h2>
      <p>Introduce la contraseña del chat y tu nombre para entrar</p>
      
      <input type="password" id="room-password" placeholder="Contraseña de acceso">
      <input type="text" id="user-nickname" placeholder="Tu nombre o apodo" autocomplete="off">
      
      <button id="btn-login">Entrar al Chat</button>
      <p id="error-msg" class="error hidden"></p>
    </div>
  </div>

  <!-- INTERFAZ DEL CHAT ESTILO WHATSAPP -->
  <div id="chat-app" class="hidden">
    <div class="chat-container">
      
      <!-- ENCABEZADO -->
      <header class="chat-header">
        <div class="avatar">💬</div>
        <div class="user-info">
          <span class="chat-title">Chat Privado</span>
          <span class="chat-subtitle" id="user-status">Desconectado</span>
        </div>
      </header>

      <!-- ÁREA DE MENSAJES -->
      <main id="messages-container" class="messages-container"></main>

      <!-- PANELS DE EMOJIS Y STICKERS -->
      <emoji-picker id="emoji-picker" class="emoji-picker hidden"></emoji-picker>

      <div id="sticker-picker" class="sticker-picker hidden">
        <div class="sticker-grid">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f600/512.webp" class="sticker-item" alt="Sticker 1">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.webp" class="sticker-item" alt="Sticker 2">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.webp" class="sticker-item" alt="Sticker 3">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.webp" class="sticker-item" alt="Sticker 4">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f929/512.webp" class="sticker-item" alt="Sticker 5">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f970/512.webp" class="sticker-item" alt="Sticker 6">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.webp" class="sticker-item" alt="Sticker 7">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp" class="sticker-item" alt="Sticker 8">
        </div>
      </div>

      <!-- BARRA INFERIOR DE ENTRADA -->
      <footer class="chat-footer">
        <button id="btn-emoji" title="Emojis">😀</button>
        <button id="btn-sticker" title="Stickers">🏷️</button>
        
        <input type="file" id="file-input" class="hidden">
        <button id="btn-attach" title="Adjuntar archivo">📎</button>
        
        <input type="text" id="message-input" placeholder="Escribe un mensaje" autocomplete="off">
        <button id="btn-send" title="Enviar">▶</button>
      </footer>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
