<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Web Ultra</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extras.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-container">
    <div class="login-card">
      <div class="whatsapp-logo">⚡</div>
      <h2>Chat Privado Ultra</h2>
      <p>Introduce tu nombre y la contraseña de acceso</p>

      <input type="text" id="user-nickname" placeholder="Tu nombre o apodo" autocomplete="off">
      <input type="password" id="room-password" placeholder="Contraseña de acceso">

      <button id="btn-login">Entrar al Chat</button>
      <p id="error-msg" class="error hidden"></p>
    </div>
  </div>

  <!-- INTERFAZ FULL SCREEN -->
  <div id="chat-app" class="hidden">
    <div class="chat-container">

      <!-- ENCABEZADO -->
      <header class="chat-header">
        <div class="header-left">
          <div class="avatar">⚡</div>
          <div class="user-info">
            <span class="chat-title">Chat Privado</span>
            <span class="chat-subtitle" id="user-status">Desconectado</span>
          </div>
        </div>
        <button id="btn-notify" class="notify-btn" title="Activar notificaciones">🔔</button>
      </header>

      <!-- ÁREA DE MENSAJES -->
      <main id="messages-container" class="messages-container"></main>

      <!-- BARRA "ESCRIBIENDO..." -->
      <div id="typing-bar" class="typing-bar hidden">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typing-text"></span>
      </div>

      <!-- PANELS DESPLEGABLES -->
      <emoji-picker id="emoji-picker" class="emoji-picker hidden"></emoji-picker>

      <div id="sticker-picker" class="sticker-picker hidden">
        <div class="picker-tabs">
          <button class="picker-tab active" data-tab="memes">😂 Memes</button>
          <button class="picker-tab" data-tab="emojis">😀 Emojis</button>
        </div>

        <div id="sticker-tab-memes" class="sticker-tab">
          <input type="text" id="sticker-search" placeholder="Buscar stickers (ej: jajaja, bro, no...)" autocomplete="off">
          <div id="sticker-chips" class="chips"></div>
          <div id="sticker-meme-grid" class="meme-grid"></div>
        </div>

        <div id="sticker-tab-emojis" class="sticker-tab hidden">
          <div class="sticker-grid" id="sticker-emoji-grid"></div>
        </div>
      </div>

      <div id="gif-picker" class="gif-picker hidden">
        <input type="text" id="gif-search" placeholder="Buscar GIF..." autocomplete="off">
        <div id="gif-grid" class="gif-grid"></div>
      </div>

      <!-- BARRA INFERIOR DE CONTROLES -->
      <footer class="chat-footer">
        <button id="btn-emoji" title="Emojis">😀</button>
        <button id="btn-sticker" title="Stickers">🏷️</button>
        <button id="btn-gif" title="GIFs">👾</button>

        <input type="file" id="file-input" class="hidden">
        <button id="btn-attach" title="Adjuntar archivo">📎</button>

        <input type="text" id="message-input" placeholder="Escribe un mensaje o menciona a @ia..." autocomplete="off">
        <button id="btn-send" title="Enviar">▶</button>
      </footer>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
